      // Environment constraint: HMR is disabled in AI Studio. Suppress WebSocket close rejections.
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason) {
          var msg = e.reason.message || String(e.reason);
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            msg.indexOf('vite:ws') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }
      });
    </script>
